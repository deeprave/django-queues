name: 'Test and Build'
description: 'Composite action to setup Python, install dependencies, run tests, and build the package using uv.'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: 'latest'

    - name: Install build dependencies
      shell: bash
      run: uv sync ${{ inputs.sync-args }}

    # Mirrors the pre-commit hooks, invoked directly so CI does not depend on
    # pre-commit itself. Keep in step with .pre-commit-config.yaml.
    - name: Lint
      shell: bash
      run: uv run ruff check

    - name: Check formatting
      shell: bash
      run: uv run ruff format --check

    - name: Check types
      shell: bash
      run: uv run ty check

    # Run ephemerally, as their pre-commit hooks do: neither is imported by the
    # package, so neither belongs in the project environment.
    - name: Audit dependencies
      shell: bash
      run: uvx osvcheck

    - name: Validate pyproject
      shell: bash
      run: uvx validate-pyproject pyproject.toml

    - name: Run the tests
      shell: bash
      run: uv run pytest

    - name: Build package
      shell: bash
      run: uv build

inputs:
  python-version:
    description: 'Python version to use'
    required: true
  sync-args:
    description: 'Extra arguments to pass to uv install'
    required: false
