name: Test and Build CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14"
            experimental: false
          - python-version: "3.15-dev"
            experimental: true

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Test and Build
        uses: ./.github/actions/test-and-build
        with:
          python-version: ${{ matrix.python-version }}
