services:
  redis:
    image: redis:8-alpine
    command: redis-server --port 16379
    ports:
      - "127.0.0.1:16379:16379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 16379 ping | grep -q PONG"]
      interval: 1s
      timeout: 3s
      retries: 10

  dashboard:
    profiles:
      - dashboard
    build:
      context: ..
      dockerfile: demo_aq/Dockerfile
    environment:
      DEMO_REDIS_URL: redis://redis:16379/0
    ports:
      - "127.0.0.1:8000:8000"
    command:
      ["sh", "-c", "python manage.py redis_lua_lib --deploy && exec python manage.py runserver 0.0.0.0:8000"]
    depends_on:
      redis:
        condition: service_healthy
