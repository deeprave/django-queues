[project]
name = "django-queues"
version = "1.3.0"
description = "Implementation of async/task and event queues for Django"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.14"
authors = [
    { name = "David Nugent", email = "davidn@uniquode.io" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "asgiref>=3.12.1",
    "django>=5.1.4",
]

[project.optional-dependencies]
redis = [
    "redis>=5.2.1",
]

[tool.ruff]
namespace-packages = ["django_queue"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-mock>=3.14.0",
    "pytest>=8.3.4",
    "ruff>=0.16.1",
    "testcontainers>=4.9.0",
    "ty>=0.0.69",
]
redis = [
    "redis>=5.2.1",
]

[tool.uv]
default-groups = ["dev", "redis"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "django_queue"
module-root = ""

[tool.ty.src]
include = ["django_queue"]
